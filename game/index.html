<style>
/* Layout: full-bleed 3D canvas, thin gilded HUD panels pinned to corners, overlays for select/game over */
:root{
 --bg:#070b18; --ink:#f1e8d6; --dim:#a69c8a; --gold:#d6a24a; --panel:rgba(9,11,20,.74);
 --line:rgba(214,162,74,.42); --hp:#5ccf78; --low:#e2533d; --boss:#c4372b; --el:#ff7a2a;
 --display:"Shojumaru","Cinzel",Georgia,serif; --brand:"Shojumaru","Cinzel",Georgia,serif; --ui:"Shojumaru","Barlow Condensed","Arial Narrow",Arial,sans-serif;
 color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--ui);user-select:none;-webkit-user-select:none}
canvas{display:block}

/* ---- Supabase ile oda (claude.ai odasıyla aynı arayüz: presence / onPeers / peers / join / leave) ---- */
function sbRoom(name){const sb=PLAT.client,key=(PLAT.user?String(PLAT.user.id).slice(0,8):'g')+'-'+Math.random().toString(36).slice(2,8);
 const mk=nm=>{const ch=sb.channel(nm,{config:{presence:{key},broadcast:{self:false}}}),me={},peers=new Map(),cbs=new Set();let ok=false,last=0,tm=null;
  const fire=()=>cbs.forEach(f=>{try{f()}catch(e){console.warn(e)}});
  const send=()=>{tm=null;if(!ok)return;last=performance.now();Promise.resolve(ch.send({type:'broadcast',event:'p',payload:{k:key,s:me}})).catch(()=>{})};
  const queue=()=>{if(tm)return;tm=setTimeout(send,Math.max(0,45-(performance.now()-last)))};
  ch.on('presence',{event:'sync'},()=>{const st=ch.presenceState(),ks=new Set(Object.keys(st));let c=false;for(const k of [...peers.keys()])if(!ks.has(k)){peers.delete(k);c=true}ks.forEach(k=>{if(k!==key&&!peers.has(k)){peers.set(k,{});c=true}});if(c){fire();queue()}});
  ch.on('broadcast',{event:'p'},m=>{const p=m&&m.payload;if(!p||typeof p.k!=='string'||p.k===key)return;peers.set(p.k,p.s&&typeof p.s==='object'?p.s:{});fire()});
  ch.subscribe(async st=>{if(st==='SUBSCRIBED'){ok=true;try{await ch.track({t:Date.now()})}catch(e){}send()}});
  const hb=setInterval(()=>{if(ok&&performance.now()-last>1000)send()},500);
  return{presence(p){Object.assign(me,p||{});queue();return Promise.resolve()},onPeers(f){cbs.add(f);return()=>cbs.delete(f)},
   peers(){const out=[{peer:key,presence:me,isMe:true,sameTab:true}];peers.forEach((v,k)=>out.push({peer:k,presence:v,isMe:false,sameTab:false}));return out},
   async leave(){clearInterval(hb);clearTimeout(tm);ok=false;try{await sb.removeChannel(ch)}catch(e){}}}};
 const lobby=mk(name);lobby.join=async n=>mk(n);return lobby}
function sbAssets(){const st=()=>PLAT.client.storage.from('assets');return{
 async upload(blob){const id=Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('');const {error}=await st().upload(id,blob,{contentType:blob.type||'application/octet-stream',upsert:false});if(error)throw{code:'upload',message:error.message};return{id,url:blobUrl(id),sizeBytes:blob.size,contentType:blob.type}},

   load();const ch=sb.channel('models-'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public',table:'models'},()=>load()).subscribe();const iv=setInterval(load,60000);return()=>{alive=false;clearInterval(iv);sb.removeChannel(ch)}}})}),
  doc:p=>{const id=String(p).split('/')[1];return{

const WSKR={},WSKT={},WSKL={};let SKD=0,SKSIG='';
function wsSel(t){const v=(SAVE.wsk||{})[t];return typeof v==='string'?v:null}

function flatOf(root){root.updateMatrixWorld(true);const g=new T.Group();root.traverse(o=>{if(o.isMesh&&o.geometry&&o.geometry.attributes.position){const geo=o.geometry.clone();geo.applyMatrix4(o.matrixWorld);geo.deleteAttribute&&geo.attributes.skinIndex&&geo.deleteAttribute('skinIndex');const m=new T.Mesh(geo,o.material);m.castShadow=true;g.add(m)}});return g}
function skinTpl(id,W,flip){const key=id+'|'+W+'|'+(flip?1:0);if(WSKT[key])return WSKT[key];const raw=WSKR[id];if(!raw)return null;
 const g=new T.Group();raw.children.forEach(m=>{const c=new T.Mesh(m.geometry.clone(),m.material);c.castShadow=true;g.add(c)});const pts=[];g.children.forEach(m=>{const p=m.geometry.attributes.position,st=Math.max(1,Math.floor(p.count/40000));for(let i=0;i<p.count;i+=st)pts.push([p.getX(i),p.getY(i),p.getZ(i)])});if(pts.length<4)return null;
 const mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];pts.forEach(q=>{for(let a=0;a<3;a++){mn[a]=Math.min(mn[a],q[a]);mx[a]=Math.max(mx[a],q[a])}});const sz=[0,1,2].map(a=>mx[a]-mn[a]);
 const cyc=[[0,1,2],[1,2,0],[2,0,1]];let ord;
 if(W==='shuriken'){const ta=sz.indexOf(Math.min(...sz));ord=cyc.find(c=>c[0]===ta)}else{const la=sz.indexOf(Math.max(...sz));ord=cyc.find(c=>c[1]===la)}
 const e=a=>[a===0?1:0,a===1?1:0,a===2?1:0],R=new T.Matrix4().set(...e(ord[0]),0,...e(ord[1]),0,...e(ord[2]),0,0,0,0,1);
 const P=pts.map(q=>[q[ord[0]],q[ord[1]],q[ord[2]]]);g.children.forEach(m=>m.geometry.applyMatrix4(R));
 let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9,z0=1e9,z1=-1e9;P.forEach(q=>{x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);z0=Math.min(z0,q[2]);z1=Math.max(z1,q[2])});
 const M=new T.Matrix4();
 if(W==='shuriken'){const s=1/Math.max(x1-x0,y1-y0,z1-z0);M.makeScale(s,s,s).multiply(new T.Matrix4().makeTranslation(-(x0+x1)/2,-(y0+y1)/2,-(z0+z1)/2))}
 else{const h=y1-y0,sl=(lo,hi)=>{const S=P.filter(q=>q[1]>=lo&&q[1]<=hi);if(!S.length)return{r:0,cx:0,cz:0};let a=1e9,b=-1e9,c=1e9,d=-1e9,sx=0,sz2=0;S.forEach(q=>{a=Math.min(a,q[0]);b=Math.max(b,q[0]);c=Math.min(c,q[2]);d=Math.max(d,q[2]);sx+=q[0];sz2+=q[2]});return{r:Math.hypot(b-a,d-c),cx:sx/S.length,cz:sz2/S.length}};
  const top=sl(y1-.12*h,y1),bot=sl(y0,y0+.12*h);let up=top.r<=bot.r;if(flip)up=!up;const end=up?top:bot,s=1/h;
  if(up)M.makeScale(s,s,s).multiply(new T.Matrix4().makeTranslation(-end.cx,-y1,-end.cz));
  else M.makeScale(s,s,s).multiply(new T.Matrix4().makeRotationX(Math.PI)).multiply(new T.Matrix4().makeTranslation(-end.cx,-y0,-end.cz))}
 if(W==='scythe'){const v=new T.Vector3();let sx=0,sz=0,n=0;P.forEach(q=>{v.set(q[0],q[1],q[2]).applyMatrix4(M);if(v.y<-.7){sx+=v.x;sz+=v.z;n++}});if(n&&Math.hypot(sx,sz)>1e-6)M.premultiply(new T.Matrix4().makeRotationY(-Math.atan2(sx,sz)))}
 g.children.forEach(m=>{m.geometry.applyMatrix4(M);m.geometry.computeBoundingSphere();m.geometry.computeBoundingBox()});WSKT[key]=g;return g}
function curSkin(W){const id=wsSel(W),d=wsDoc(id);if(!d||d.cat!==W)return null;const tpl=skinTpl(id,W,!!d.flip);return tpl?{tpl,d}:null}
function applySkin(r,W,L){try{if(!r||!r.wg||!L||!L.ws||!WTYPES.includes(W))return;const d=wsDoc(L.ws);if(!d||d.cat!==W)return;const tpl=skinTpl(d.id,W,!!d.flip);if(!tpl)return;

  else{h.scale.setScalar((bb.max.y-bb.min.y)*k);h.position.set(0,bb.max.y,0)}g.add(h)};
