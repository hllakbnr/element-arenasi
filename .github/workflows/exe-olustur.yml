name: Exe oluştur
# Her güncellemede yeni sürüm numarasıyla Windows kurulumu (exe) ve Android uygulaması (apk) üretir ve yayınlar.
# Kurulu masaüstü uygulamaları açılışta bunu görür ve kendini günceller; telefonda oyun "İndir" uyarısı gösterir.
on:
  push:
    branches: [main]
    paths: ['game/**', 'main.js', 'preload.js', 'update.html', 'package.json', 'app-config.json', 'build/**', 'tools/**', 'mobile/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: exe
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/fonts.mjs
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - run: npm install
      - run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    needs: windows
    runs-on: ubuntu-latest
    env:
      VER: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: node tools/fonts.mjs
      - name: Android projesini hazırla
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node build-www.mjs "$VER"
          npx cap add android
          node patch-android.mjs "$VER" "${{ github.run_number }}"
          npx cap sync android
      - name: İmza anahtarı
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS" ] && [ -n "$KSP" ]; then
            echo "$KS" | base64 -d > mobile/android/app/ea.jks
            echo "EA_KS_PASS=$KSP" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE ayarı yok; geçici imza kullanılıyor (güncellemede uygulamayı silip yeniden kurmak gerekir)."
            keytool -genkeypair -keystore mobile/android/app/ea.jks -alias ea -keyalg RSA -keysize 2048 -validity 10000 -storepass geciciImza123 -keypass geciciImza123 -dname "CN=Element Arenasi"
            echo "EA_KS_PASS=geciciImza123" >> "$GITHUB_ENV"
          fi
      - name: APK oluştur
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../../ElementArenasi.apk
      - name: Sürüme ekle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v$VER" ElementArenasi.apk --clobber

  discord:
    needs: [windows, android]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - name: Discord'a güncelleme notlarını gönder
        run: node tools/discord.mjs
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          APK_OK: ${{ needs.android.result == 'success' }}
