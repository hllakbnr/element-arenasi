name: Exe oluştur
on:
  push:
    branches: [main]
    paths: ['main.js', 'preload.js', 'package.json', 'app-config.json', 'build/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win nsis --publish never
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Element Arenası 1.0.${{ github.run_number }}
          body: Windows kurulum dosyası. İndir, çift tıkla, masaüstündeki Element Arenası simgesinden aç.
          files: dist/ElementArenasi-Kurulum.exe
