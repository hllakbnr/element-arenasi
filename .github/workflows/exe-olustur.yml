name: Exe oluştur
# Her güncellemede yeni sürüm numarasıyla exe üretir ve yayınlar.
# Kurulu uygulamalar açılışta bunu görür, güncelleme ekranını gösterip kendini günceller.
on:
  push:
    branches: [main]
    paths: ['game/**', 'main.js', 'preload.js', 'update.html', 'package.json', 'app-config.json', 'build/**', 'tools/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: exe
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/fonts.mjs
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - run: npm install
      - run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
