name: Exe oluştur
# Her güncellemede yeni sürüm numarasıyla Windows kurulumu (exe) ve Android uygulaması (apk) üretir ve yayınlar.
# Kurulu masaüstü uygulamaları açılışta bunu görür ve kendini günceller; telefonda oyun "İndir" uyarısı gösterir.
on:
  push:
    branches: [main]
    paths: ['game/**', 'main.js', 'preload.js', 'update.html', 'package.json', 'app-config.json', 'build/**', 'tools/**', 'mobile/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: exe
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/fonts.mjs
      - run: node tools/vendor.mjs
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - run: npm install
      - run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    needs: windows
    runs-on: ubuntu-latest
    env:
      VER: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: node tools/fonts.mjs
      - run: node tools/vendor.mjs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Oyun dosyalarını uygulamaya koy
        working-directory: mobile
        run: node build-www.mjs "$VER"
      - name: Firefox motoru (GeckoView) sürümünü seç
        run: |
          GV=$(curl -fsSL https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview/maven-metadata.xml | sed -n 's:.*<release>\(.*\)</release>.*:\1:p' | head -1)
          [ -n "$GV" ] || GV="+"
          echo "GeckoView: $GV"
          echo "GV=$GV" >> "$GITHUB_ENV"
      - name: İmza anahtarı
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          K=mobile/gecko/app/ea.jks
          if [ -n "$KSP" ] && [ -n "$KS" ]; then
            echo "$KS" | base64 -d > $K
            echo "EA_KS_PASS=$KSP" >> "$GITHUB_ENV"
          elif [ -n "$KSP" ] && openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in mobile/ea-release.jks.enc -out $K -pass "pass:$KSP"; then
            echo "Kalıcı imza anahtarı kullanılıyor."
            echo "EA_KS_PASS=$KSP" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_PASS ayarı yok; geçici imza kullanılıyor (güncellemede uygulamayı silip yeniden kurmak gerekir)."
            rm -f $K
            keytool -genkeypair -keystore $K -alias ea -keyalg RSA -keysize 2048 -validity 10000 -storepass geciciImza123 -keypass geciciImza123 -dname "CN=Element Arenasi"
            echo "EA_KS_PASS=geciciImza123" >> "$GITHUB_ENV"
          fi
      - name: APK oluştur
        working-directory: mobile/gecko
        run: |
          gradle assembleRelease --no-daemon --stacktrace -PgvVersion="$GV" -PeaVer="$VER" -PeaCode="${{ github.run_number }}"
          ls -la app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk ../../ElementArenasi.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk ../../ElementArenasi-32.apk
      - name: Sürüme ekle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v$VER" ElementArenasi.apk ElementArenasi-32.apk --clobber

  discord:
    needs: [windows, android]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version
      - name: Discord'a güncelleme notlarını gönder
        run: node tools/discord.mjs
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          APK_OK: ${{ needs.android.result == 'success' }}
