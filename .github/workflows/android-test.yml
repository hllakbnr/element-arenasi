name: Android emülatör testi
# Her yayından sonra kendiliğinden çalışır: yeni APK sanal bir telefona kurulup açılır, ekran görüntüsü alınır.
on:
  workflow_run:
    workflows: [Exe oluştur]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Test edilecek sürüm (ör. v1.0.29)
        required: false
      apk:
        description: APK dosyası
        default: ElementArenasi.apk
      api:
        description: Android API seviyesi
        default: '34'
      from:
        description: Önce kurulacak eski sürüm (güncelleme testi, boş bırakılabilir)
        default: ''
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      TAG: ${{ inputs.tag }}
      APK: ${{ inputs.apk || 'ElementArenasi.apk' }}
      API: ${{ inputs.api || '34' }}
      FROM: ${{ inputs.from }}
    steps:
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: APK indir ve incele
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -n "$TAG" ] || TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)
          echo "Test: $TAG $APK (API $API)"
          gh release download "$TAG" -R ${{ github.repository }} -p "$APK" -O app.apk
          if [ -n "$FROM" ]; then gh release download "$FROM" -R ${{ github.repository }} -p ElementArenasi.apk -O old.apk; fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1); echo "build-tools: $BT"
          $BT/apksigner verify --verbose --print-certs app.apk | head -20 || true
          $BT/aapt2 dump badging app.apk | head -12 || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell getprop ro.product.cpu.abilist
            if [ -f old.apk ]; then adb install old.apk 2>&1 | tee old.txt; fi
            adb install -r app.apk 2>&1 | tee install.txt || true
            grep -q Success install.txt || echo "::error::APK kurulamadı" 
            adb shell am start -n com.elementarenasi.oyun/.MainActivity || true
            sleep 45
            adb exec-out screencap -p > shot1.png || true
            adb shell input tap 400 300 || true
            sleep 15
            adb exec-out screencap -p > shot2.png || true
            sleep 40
            adb exec-out screencap -p > shot3.png || true
            sleep 70
            adb exec-out screencap -p > shot4.png || true
            adb logcat -d > logcat.txt || true
            grep -iE "AndroidRuntime|FATAL|GeckoView|Gecko.*error|elementarenasi|Console" logcat.txt | tail -80 || true
      - name: Ekran görüntülerini paylaş
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view emu-test -R ${{ github.repository }} >/dev/null 2>&1 || gh release create emu-test -R ${{ github.repository }} --prerelease --title "Emülatör testi (otomatik)" --notes "Test görüntüleri"
          for f in shot1.png shot2.png shot3.png shot4.png logcat.txt; do cp $f api$API-$f 2>/dev/null; done; gh release upload emu-test -R ${{ github.repository }} api$API-* --clobber || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonuc
          path: |
            install.txt
            shot1.png
            shot2.png
            logcat.txt
