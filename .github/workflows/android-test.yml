name: Android emülatör testi
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Test edilecek sürüm (ör. v1.0.29)
        required: true
      apk:
        description: APK dosyası
        default: ElementArenasi.apk
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: APK indir ve incele
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${{ inputs.tag }}" -R ${{ github.repository }} -p "${{ inputs.apk }}" -O app.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1); echo "build-tools: $BT"
          $BT/apksigner verify --verbose --print-certs app.apk | head -20 || true
          $BT/aapt2 dump badging app.apk | head -12 || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell getprop ro.product.cpu.abilist
            adb install -r app.apk 2>&1 | tee install.txt || true
            adb shell am start -n com.elementarenasi.oyun/.MainActivity || true
            sleep 45
            adb exec-out screencap -p > shot1.png || true
            adb shell input tap 400 300 || true
            sleep 15
            adb exec-out screencap -p > shot2.png || true
            adb logcat -d > logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonuc
          path: |
            install.txt
            shot1.png
            shot2.png
            logcat.txt
